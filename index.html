<style>
  :root {
    --bg: #f3f4fa;
    --bg-elevated: #ffffff;

    --ink: #15161d;
    --ink-muted: #565a68;
    --ink-faint: #868993;
    --accent-1: #8b3ffb;
    --accent-2: #3b7bfb;
    --accent-ink: #ffffff;
    --whatsapp: #22c55e;
    --shadow: 0 1px 0 rgba(20,21,30,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101019;
      --bg-elevated: #1a1b26;
      --panel-line: rgba(245, 246, 250, 0.12);
      --ink: #f5f6fa;
      --ink-muted: #b3b6c4;
      --ink-faint: #767a89;
      --accent-1: #9b5cfb;
      --accent-2: #4f8bff;
      --accent-ink: #ffffff;
      --whatsapp: #2fdb72;
      --shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101019;
    --bg-elevated: #1a1b26;
    --panel-line: rgba(245, 246, 250, 0.12);
    --ink: #f5f6fa;
    --ink-muted: #b3b6c4;
    --ink-faint: #767a89;
    --accent-1: #9b5cfb;
    --accent-2: #4f8bff;
    --accent-ink: #ffffff;
    --whatsapp: #2fdb72;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #f3f4fa;
    --bg-elevated: #ffffff;
    --panel-line: rgba(20, 21, 30, 0.12);
    --ink: #15161d;
    --ink-muted: #565a68;
    --ink-faint: #868993;
    --accent-1: #8b3ffb;
    --accent-2: #3b7bfb;
    --accent-ink: #ffffff;
    --whatsapp: #22c55e;
    --shadow: 0 1px 0 rgba(20,21,30,0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  .grid-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 38%, #000 0%, transparent 72%);
            mask-image: radial-gradient(ellipse 70% 55% at 50% 38%, #000 0%, transparent 72%);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--bg-elevated);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    padding: 36px 30px 30px;
    box-shadow: var(--shadow), 0 20px 60px -30px rgba(0,0,0,0.5);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 22px;
  }

  .signal-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--whatsapp);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--whatsapp) 22%, transparent);
    flex: none;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.82); }
  }

  @media (prefers-reduced-motion: reduce) {
    .signal-dot { animation: none; }
  }

  .wordmark {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 9vw, 44px);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
    text-wrap: balance;
  }

  .wordmark span {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subline {
    margin: 10px 0 0;
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.5;
    max-width: 34ch;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 28px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-line);
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
  }

  .link-btn:hover {
    border-color: color-mix(in srgb, var(--accent-2) 55%, var(--panel-line));
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent-1) 8%, transparent), color-mix(in srgb, var(--accent-2) 8%, transparent));
  }

  .link-btn:active { transform: scale(0.99); }

  .link-btn:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .link-btn.primary {
    background: var(--whatsapp);
    border-color: var(--whatsapp);
    color: var(--accent-ink);
  }

  .link-btn.primary:hover { background: var(--whatsapp); filter: brightness(1.06); }

  .link-btn.gradient {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    border-color: transparent;
    color: var(--accent-ink);
  }

  .link-btn.gradient:hover { filter: brightness(1.08); background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
  .link-btn.gradient .link-meta { color: rgba(255,255,255,0.8); }

  .icon {
    width: 20px;
    height: 20px;
    flex: none;
  }

  .link-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

  .link-title { font-size: 14.5px; font-weight: 600; }

  .link-meta {
    font-size: 12px;
    color: var(--ink-faint);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-btn.primary .link-meta { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }

  .arrow { margin-left: auto; flex: none; opacity: 0.5; }

  .footer {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--panel-line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
</style>
