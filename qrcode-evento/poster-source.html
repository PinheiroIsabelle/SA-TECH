  .frame {

  .brand-row {

  }

    border-radius: 50%;

    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.02em;

    background-clip: text;
    color: transparent;
  }

    line-height: 1.55;
    color: #b3b6c4;
    max-width: 620px;

    align-items: center;
    justify-content: center;
    gap: 56px;
    margin-top: 90px;

  }

  }

  .scan-title {

    font-weight: 700;
    line-height: 1.3;

    align-items: center;
    gap: 14px;
    font-size: 18px;

  }

  .chip {

    align-items: center;
    justify-content: center;
